const stages=["UNSTARTED","INSTALLED","WIRED","TESTED"];
const icons=["⬜","🏠","🔌","⚡"];
const key="halloween-light-show-progress-v1";
let state=JSON.parse(localStorage.getItem(key)||"{}");
let filter="ALL", query="";
function save(){localStorage.setItem(key,JSON.stringify(state));}
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display="none",1800)}
function stage(id){return Number(state[id]||0)}
function renderTabs(){
 const tabs=document.getElementById("tabs");
 tabs.innerHTML='<button class="tab '+(filter==="ALL"?"active":"")+'" data-filter="ALL">ALL</button>'+
 DATA.controllers.map(c=>'<button class="tab '+(filter===c.name?"active":"")+'" data-filter="'+esc(c.name)+'">'+(c.name==="FPP-40"?"🎃 ":c.name==="FPP-32"?"🌲 ":"📽️ ")+esc(c.name)+'</button>').join("");
}
function render(){
 renderTabs();
 const app=document.getElementById("app");
 let total=DATA.props.length, ready=0, installed=0,wired=0,tested=0;
 DATA.props.forEach(p=>{let s=stage(p.id);if(s>=1)installed++;if(s>=2)wired++;if(s>=3)tested++;if(s>=4)ready++});
 let pct=total?Math.round(ready/total*100):0;
 document.getElementById("pct").textContent=pct+"%";
 document.getElementById("fill").style.width=pct+"%";
 document.getElementById("readyBig").textContent=ready+" SHOW READY";
 document.getElementById("totalBig").textContent="of "+total+" props";
 document.getElementById("installedStat").textContent="🏠 "+installed+" installed";
 document.getElementById("wiredStat").textContent="🔌 "+wired+" wired";
 document.getElementById("testedStat").textContent="⚡ "+tested+" tested";
 document.getElementById("remainingStat").textContent="👻 "+(total-ready)+" remaining";
 let controllers=DATA.controllers.filter(c=>filter==="ALL"||c.name===filter);
 let any=false;
 app.innerHTML=controllers.map(c=>{
   const ports=c.ports.filter(p=>p.models.some(m=>matches(c,p,m)));
   if(!ports.length)return "";
   any=true;
   return '<section class="controller"><div class="controllerHead"><div><div class="controllerTitle">'+(c.name==="FPP-40"?"🎃":c.name==="FPP-32"?"🌲":"📽️")+" "+esc(c.name)+'</div><div class="controllerMeta">DDP '+esc(c.ip)+'</div></div></div>'+
   ports.map(p=>'<div class="port"><div class="portHead"><div class="portName">'+esc(p.port)+'</div><div class="chain">'+(p.models.length>1?"🔗 "+p.models.map(esc).join(" → "):"")+'</div></div><div class="cards">'+p.models.map((m,i)=>card(c,p,m,i)).join("")+'</div></div>').join("")+'</section>';
 }).join("") || '<div class="empty">No props match your search.</div>';
}
function matches(c,p,m){return !query || (m+" "+c.name+" "+p.port).toLowerCase().includes(query.toLowerCase())}
function card(c,p,m,i){
 const id=slug(c.name+"-"+p.port+"-"+m), s=stage(id), ready=s===4;
 const chain=p.models.length>1 ? '<div class="chainLine">🔗 <b>Connection:</b> '+(i===0?"Controller → "+esc(m):esc(p.models[i-1])+" → "+esc(m))+(i<p.models.length-1?" → "+esc(p.models[i+1]):"")+'</div>' : "";
 return '<article class="card '+(ready?"ready":"")+'"><div class="cardTop"><div><div class="name">'+(c.name==="FPP-32"?"🌲":c.name==="FPP-Projector"?"📽️":"👻")+" "+esc(m)+'</div><div class="meta">'+esc(c.name)+' • '+esc(p.port)+'</div></div><span class="badge '+(ready?"ready":"")+'">'+(ready?"🎉 READY":stages[Math.min(s,3)])+'</span></div>'+chain+'<div class="steps">'+stages.map((x,j)=>'<button class="step '+(s>j?"done ":"")+(s===j?"active":"")+'" data-id="'+id+'" data-stage="'+j+'">'+icons[j]+'<br>'+x+'</button>').join("")+'</div><div class="small" style="margin-top:9px">'+(ready?"🎉 This prop is show ready!":"Next: "+stages[Math.min(s+1,3)])+'</div></article>';
}
function slug(x){return x.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.filter){filter=b.dataset.filter;render();return}
 if(b.dataset.id){state[b.dataset.id]=Number(b.dataset.stage);save();render();showToast(Number(b.dataset.stage)===3?"⚡ Tested!":"Progress saved");return}
 if(b.id==="reset"){if(confirm("Reset every prop to Unstarted?")){state={};save();render();showToast("All props reset")}}
 if(b.id==="export"){const blob=new Blob([JSON.stringify({savedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="halloween-light-show-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
 if(b.id==="importBtn")document.getElementById("importFile").click();
});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render()});
document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=x.state||{};save();render();showToast("Backup imported")}catch{showToast("Invalid backup file")}};r.readAsText(f)});
render();
</script>
